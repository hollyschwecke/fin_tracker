<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Account</title>
</head>
<body>
    <h1>Add Account</h1>
    <p>Enter the details of your new financial account below.</p>

    <!-- display feedback messages from Flask -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <!-- submit account information to the add_account route -->
    <form method="POST" action="{{ url_for('add_account') }}">

        <!-- account name -->
        <label for="account_name">Account Name:</label>
        <input type="text" id="account_name" name="account_name" placeholder="e.g. Personal Checking" maxlength="100" required>
        
        <br><br>
        
        <!-- account type -->
        <label for="account_type">Account Type:</label>
        <select id="account_type" name="account_type" required>
            <option value="">Select an account type</option>
            {% for account_type in account_types %}
                <option value="{{ account_type }}">{{ account_type }}</option>
            {% endfor %}
        </select>

        <br><br>
        
        <!-- current balance -->
        <label for="current_balance">Current Balance:</label>
        <input type="number" id="current_balance" name="current_balance" step="0.01" placeholder="0.00" required>
        
        <br><br>

        <button type="submit">Add Account</button>

    </form>

    <br>
    <!-- return to dashboard without creating an account -->
    <a href="{{ url_for('dashboard') }}">Return to Dashboard</a>

</body>
</html>
